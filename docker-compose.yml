# Local development database only. The app itself runs directly on the host (npm run dev).
# Bound to 127.0.0.1 so the dev database is never exposed to the network.
name: qrcare

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrcare_dev_password}
      POSTGRES_DB: qrcare
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - qrcare_pg:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume: creates the separate test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qrcare -d qrcare']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qrcare_pg:
