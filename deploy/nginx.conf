# Example nginx site in front of the app on a VPS: HTTPS termination + reverse proxy.
# Certificates from Let's Encrypt (certbot). Replace qrcare.example.vn with your domain.
#   sudo certbot certonly --nginx -d qrcare.example.vn
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/qrcare && sudo ln -s ...
# The app already sends its own security headers (CSP, frame-ancestors, nosniff,
# Referrer-Policy, X-Robots-Tag) and caching rules; nginx only adds transport concerns.

server {
    listen 80;
    listen [::]:80;
    server_name qrcare.example.vn;
    # Everything over HTTPS (QR links, cookies, personal data).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qrcare.example.vn;

    ssl_certificate     /etc/letsencrypt/live/qrcare.example.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrcare.example.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Avatars are at most 5 MB; leave a little room for the multipart envelope.
    client_max_body_size 6m;

    # Do not log query strings or bodies; the app keeps its own redacted request log.
    access_log /var/log/nginx/qrcare.access.log combined;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts exactly one proxy (TRUST_PROXY=1) for the client IP used in rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
